<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Optimus</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
</head>
<body>
<div id="root"><p style="font:15px system-ui;padding:24px;color:#555">Loading Optimus…</p></div>
<script>
  window.__recovery = /type=recovery/.test(location.hash);
  window.__showErr = function (m) { var r = document.getElementById('root'); r.innerHTML = '<div style="font:14px system-ui;padding:24px;max-width:720px;color:#111;background:#fff"><b>Optimus could not start.</b><p>Please send this message to your admin:</p><pre style="white-space:pre-wrap;background:#f3f3f3;padding:12px;border-radius:8px"></pre></div>'; r.querySelector('pre').textContent = String(m); };
  window.addEventListener('error', function (e) { window.__showErr((e.message || 'Error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
  window.addEventListener('unhandledrejection', function (e) { window.__showErr('Unhandled: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
  setTimeout(function () { var r = document.getElementById('root'); if (r && /Loading Optimus/.test(r.textContent)) window.__showErr('The app script did not load. Check that the assets folder was uploaded.'); }, 8000);
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
